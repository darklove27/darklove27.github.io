name: Publish Milart release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "assets/downloads/Milart.exe#Milart.exe" --title "Milart $GITHUB_REF_NAME" --notes "Сборка Milart для Windows 10/11. Приложение создано с помощью нейросети."
